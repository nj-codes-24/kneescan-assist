# S1: R1b with a 10x smaller backbone learning rate (1e-5, as B0 uses). Hypothesis: 1e-4 overwrites the pretrained features
# on only ~800 exams. Everything else is identical to configs/reader_r18_fbn.yaml.
name: reader_r18_lowlr
backbone: resnet18
pretrained: true
att_dim: 128
dropout: 0.25
plane_dropout: 0.2
freeze_batchnorm: true
epochs: 20
lr: 1.0e-5
head_lr: 1.0e-3
weight_decay: 1.0e-4
accumulate_exams: 8
rotate_deg: 25.0
shift_px: 25.0
flip_p: 0.5
amp: true
deterministic: true
num_workers: 0
seed: 42
