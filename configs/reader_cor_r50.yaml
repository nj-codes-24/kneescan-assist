# Idea I4 screen (fold 1, coronal specialist): ResNet-50 with timm ImageNet weights (the control for RadImageNet).
# Compared on fold 1 with reader_cor_r50 (same network, ImageNet weights) to isolate the effect of medical pretraining.
name: reader_cor_r50
backbone: resnet50
pretrained: true
att_dim: 128
dropout: 0.25
plane_dropout: 0.2
freeze_batchnorm: true
pooling: attention
planes: [coronal]
epochs: 20
lr: 1.0e-4
head_lr: 1.0e-3
weight_decay: 1.0e-4
accumulate_exams: 8
rotate_deg: 25.0
shift_px: 25.0
flip_p: 0.5
amp: true
deterministic: true
num_workers: 0
seed: 42
