# Makes `kneescan` importable from anywhere in the venv:
#   .venv\Scripts\python.exe -m pip install -e .
# Dependencies live in requirements.txt (with exact pins); this file only describes the package.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kneescan"
version = "0.1.0"
description = "KneeScan Assist: knee MRI decision-support research prototype (NOT a medical device)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["kneescan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU", "data: needs a real dataset under data/"]
