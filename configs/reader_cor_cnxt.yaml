# Screen for ladder step L1 on R2: the coronal specialist with a ConvNeXt-Tiny backbone (fold 1 only). Compared with
# reader_cor_att fold 1 (ResNet-18). If it clearly helps, all three specialists get ConvNeXt for 5 folds.
name: reader_cor_cnxt
backbone: convnext_tiny.fb_in22k_ft_in1k
pretrained: true
att_dim: 128
dropout: 0.25
plane_dropout: 0.2
freeze_batchnorm: true
pooling: attention
planes: [coronal]
epochs: 20
lr: 1.0e-4
head_lr: 1.0e-3
weight_decay: 1.0e-4
accumulate_exams: 8
rotate_deg: 25.0
shift_px: 25.0
flip_p: 0.5
amp: true
deterministic: true
num_workers: 0
seed: 42
