# Idea I3 screen (fold 1, coronal specialist): the first half of ResNet-18 (conv1, layer1, layer2) stays frozen.
# One change vs configs/reader_cor_att.yaml; compared on fold 1 with reader_cor_att (macro 0.863).
name: reader_cor_frz
backbone: resnet18
pretrained: true
att_dim: 128
dropout: 0.25
plane_dropout: 0.2
freeze_batchnorm: true
pooling: attention
planes: [coronal]
epochs: 20
lr: 1.0e-4
head_lr: 1.0e-3
weight_decay: 1.0e-4
accumulate_exams: 8
rotate_deg: 25.0
shift_px: 25.0
flip_p: 0.5
amp: true
deterministic: true
num_workers: 0
seed: 42
frozen_prefixes: [conv1, bn1, layer1, layer2]
